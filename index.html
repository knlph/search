<!DOCTYPE html>
<html>
<head>
    <title>Bing Search Spam Test</title>
</head>
<body>

<button id="go">Open 100 Bing Searches</button>

<script>
document.getElementById("go").addEventListener("click", () => {

    const topics = [
        "black holes",
        "deep sea creatures",
        "ancient civilizations",
        "space mysteries",
        "human brain facts",
        "future technology",
        "unsolved mysteries",
        "interesting psychology",
        "quantum physics",
        "lost cities"
    ];

    for (let i = 0; i < 100; i++) {

        const topic =
            topics[Math.floor(Math.random() * topics.length)];

        window.open(
            `https://www.bing.com/search?q=${encodeURIComponent(topic)}`,
            "_blank"
        );
    }

});
</script>

</body>
</html>
